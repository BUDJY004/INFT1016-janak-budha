<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chrome Style Page</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background-color: #ffffff;
color: #202124;
transition: background 0.3s, color 0.3s;
}

header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px 20px;
background-color: #f1f3f4;
border-bottom: 1px solid #ddd;
}

button {
padding: 6px 14px;
border: none;
border-radius: 20px;
cursor: pointer;
background-color: #1a73e8;
color: white;
margin-left: 5px;
}

main {
text-align: center;
margin-top: 80px;
}

input {
padding: 10px;
width: 220px;
border-radius: 20px;
border: 1px solid #ccc;
}

/* Dark mode */
.dark {
background-color: #202124;
color: #e8eaed;
}

.dark header {
background-color: #303134;
}

.dark input {
background-color: #303134;
color: white;
border: 1px solid #555;
}

.dark button {
background-color: #8ab4f8;
color: black;
}

#time {
margin-top: 20px;
font-size: 18px;
color: #5f6368;
}

.dark #time {
color: #bdc1c6;
}

/* Centered image */
#displayImage {
width: 350px;
border-radius: 10px;
margin: 20px auto;
display: none;
}
</style>
</head>

<body>

<header>
<div id="greeting">Welcome</div>
<div>
<button onclick="changeName()">Change Name</button>
<button onclick="toggleTheme()">Toggle Theme</button>
</div>
</header>

<main>
<h1>Google-Style Home</h1>

<div id="nameBox">
<input type="text" id="nameInput" placeholder="Enter your name">
<br><br>
<button onclick="saveName()">Save Name</button>
</div>

<div id="time">Loading Adelaide time...</div>

<!-- IMAGE SECTION -->
<div id="imageSection" style="margin-top:40px;">
<img id="displayImage" src="" alt="Displayed Image">
<p id="imageDescription" style="font-size:16px; display:none;"></p>

<button onclick="showImageA()">Show Picture A</button>
<button onclick="showImageB()">Show Picture B</button>
</div>

</main>

<script>
// ===== Theme =====
function toggleTheme() {
document.body.classList.toggle("dark");
localStorage.setItem(
"theme",
document.body.classList.contains("dark") ? "dark" : "light"
);
}

if (localStorage.getItem("theme") === "dark") {
document.body.classList.add("dark");
}

// ===== Name =====
function saveName() {
let name = document.getElementById("nameInput").value.trim();
if (name) {
localStorage.setItem("username", name);
showGreeting(name);
}
}

function showGreeting(name) {
document.getElementById("greeting").innerText = "Hello, " + name + " 👋";
document.getElementById("nameBox").style.display = "none";
}

function changeName() {
localStorage.removeItem("username");
document.getElementById("nameInput").value = "";
document.getElementById("nameBox").style.display = "block";
document.getElementById("greeting").innerText = "Welcome";
}

let savedName = localStorage.getItem("username");
if (savedName) {
showGreeting(savedName);
}

// ===== Adelaide Time =====
function updateTime() {
let options = {
timeZone: "Australia/Adelaide",
hour: "2-digit",
minute: "2-digit",
second: "2-digit"
};
document.getElementById("time").innerText =
"Adelaide Time: " +
new Date().toLocaleTimeString("en-AU", options);
}

setInterval(updateTime, 1000);
updateTime();

// ===== Image Swap =====
function showImageA() {
document.getElementById("displayImage").src =
"https://tse3.mm.bing.net/th/id/OIP.D1RLSq_S0skCavtfTxcUjAHaE8?pid=ImgDet&w=474&h=316&rs=1&o=7&rm=3";

document.getElementById("imageDescription").innerText =
"Picture A: A calm and peaceful outdoor scene.";

document.getElementById("displayImage").style.display = "block";
document.getElementById("imageDescription").style.display = "block";
}

function showImageB() {
document.getElementById("displayImage").src =
"https://static.vecteezy.com/system/resources/thumbnails/031/691/778/small_2x/within-gym-with-modern-fitness-equipment-for-fitness-events-and-more-modern-of-gym-interior-with-equipment-sports-equipment-in-the-gym-created-with-generative-ai-photo.jpg";

document.getElementById("imageDescription").innerText =
"Picture B: A modern gym interior with fitness equipment.";

document.getElementById("displayImage").style.display = "block";
document.getElementById("imageDescription").style.display = "block";
}

// ⭐ Load Picture A automatically on page load
window.onload = function () {
showImageA();
};
</script>

</body>
</html>
