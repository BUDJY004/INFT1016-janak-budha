<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chrome Style Page</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #ffffff;
    color: #202124;
    transition: background 0.3s, color 0.3s;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background-color: #f1f3f4;
    border-bottom: 1px solid #ddd;
}

button {
    padding: 6px 14px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background-color: #1a73e8;
    color: white;
    margin-left: 5px;
}

main {
    text-align: center;
    margin-top: 80px;
}

input {
    padding: 10px;
    width: 220px;
    border-radius: 20px;
    border: 1px solid #ccc;
}

/* Dark mode */
.dark {
    background-color: #202124;
    color: #e8eaed;
}

.dark header {
    background-color: #303134;
}

.dark input {
    background-color: #303134;
    color: white;
    border: 1px solid #555;
}

.dark button {
    background-color: #8ab4f8;
    color: black;
}

#time {
    margin-top: 20px;
    font-size: 18px;
    color: #5f6368;
}
</style>
</head>

<body>

<header>
    <div id="greeting">Welcome</div>
    <div>
        <button onclick="changeName()">Change Name</button>
        <button onclick="toggleTheme()">Toggle Theme</button>
    </div>
</header>

<main>
    <h1>Google-Style Home</h1>

    <div id="nameBox">
        <input type="text" id="nameInput" placeholder="Enter your name">
        <br><br>
        <button onclick="saveName()">Save Name</button>
    </div>

    <div id="time">Loading Adelaide time...</div>
</main>

<script>
// ===== Theme =====
function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem(
        "theme",
        document.body.classList.contains("dark") ? "dark" : "light"
    );
}

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}

// ===== Name =====
function saveName() {
    let name = document.getElementById("nameInput").value.trim();
    if (name) {
        localStorage.setItem("username", name);
        showGreeting(name);
    }
}

function showGreeting(name) {
    document.getElementById("greeting").innerText = "Hello, " + name + " 👋";
    document.getElementById("nameBox").style.display = "none";
}

function changeName() {
    localStorage.removeItem("username");
    document.getElementById("nameInput").value = "";
    document.getElementById("nameBox").style.display = "block";
    document.getElementById("greeting").innerText = "Welcome";
}

let savedName = localStorage.getItem("username");
if (savedName) {
    showGreeting(savedName);
}

// ===== Adelaide Time =====
function updateTime() {
    let options = {
        timeZone: "Australia/Adelaide",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    };
    document.getElementById("time").innerText =
        "Adelaide Time: " +
        new Date().toLocaleTimeString("en-AU", options);
}

setInterval(updateTime, 1000);
updateTime();
</script>

</body>
</html>






<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wildlife Image Switcher</title>

    <script>
        // Function to display Koala information
        function showKoala() {
            document.getElementById("photo").src =
                "https://images.pexels.com/photos/674010/pexels-photo-674010.jpeg";
            document.getElementById("info").innerHTML =
                'Koala – Photo from <a href="https://www.pexels.com/photo/koala-on-tree-674010/" target="_blank">Pexels</a>';
        }
A koala resting calmly on a tree branch, highlighting its relaxed behaviour and tree-dwelling nature.
        // Function to display Tiger information
        function showTiger() {
            document.getElementById("photo").src =
                "https://images.pexels.com/photos/145939/pexels-photo-145939.jpeg";
            document.getElementById("info").innerHTML =
                'Tiger – Photo from <a href="https://www.pexels.com/photo/kangaroo-on-field-145939/" target="_blank">Pexels</a>';}
 A tiger standing in a natural open field, representing Australia’s unique wildlife and landscape.

    </script>
</head>

<body>
    <main>
        <h1>Australian Wildlife Gallery</h1>

        <!-- Default image shown on page load -->
        <img id="photo"
             src="https://images.pexels.com/photos/145939/pexels-photo-145939.jpeg"
             alt="Tiger"
             width="400">
              
        <!-- Description text with link -->
        <p id="info">
            Tiger – Photo from
            <a href="https://www.pexels.com/photo/Tiger/" target="_blank">
                Pexels
            </a>
        </p>

        <!-- Buttons -->
        <button onclick="showTiger()">Tiger</button>
        <button onclick="showKoala()">Koala</button>
    </main>
</body>
</html>
