
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Goals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- ===== NAV ===== -->
<header class="nav">
  <h2>📋 Goals</h2>

  <nav>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="goals.html">Goals</a>
  </nav>

  <button id="themeBtn">☀️</button>
</header>

<!-- ===== PASSWORD SCREEN ===== -->
<section id="lockScreen" class="card">
  <h2>🔒 Enter Password</h2>
  <input type="password" id="passwordInput" placeholder="Password">
  <button id="unlockBtn">Enter</button>
  <p id="errorMsg"></p>
</section>

<!-- ===== TODO APP ===== -->
<section id="todoApp" class="card hidden">
  <h1>My To-Do List</h1>

  <div class="todo-input">
    <input type="text" id="taskInput" placeholder="Add a new task">
    <button id="addBtn">Add</button>
    <button id="loadBtn">Load</button>
  </div>

  <ul id="taskList"></ul>
</section>

<!-- ===== JAVASCRIPT ===== -->
<script>
  /* ===== THEME (PERSISTENT) ===== */
  const themeBtn = document.getElementById("themeBtn");

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    themeBtn.textContent = "🌙";
  }

  themeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    themeBtn.textContent = isDark ? "🌙" : "☀️";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  });

  /* ===== PASSWORD SYSTEM ===== */
  const PASSWORD = "Janakbudha$1234";
  const unlockBtn = document.getElementById("unlockBtn");

  unlockBtn.addEventListener("click", () => {
    const input = document.getElementById("passwordInput").value;
    const error = document.getElementById("errorMsg");

    if (input === PASSWORD) {
      document.getElementById("lockScreen").classList.add("hidden");
      document.getElementById("todoApp").classList.remove("hidden");
    } else {
      error.textContent = "Incorrect password";
      error.style.color = "red";
    }
  });

  /* ===== TODO LIST ===== */
  const addBtn = document.getElementById("addBtn");
  const loadBtn = document.getElementById("loadBtn");
  const taskInput = document.getElementById("taskInput");
  const taskList = document.getElementById("taskList");

  function saveTasks() {
    const tasks = [];
    taskList.querySelectorAll("li span").forEach(span => {
      tasks.push(span.textContent);
    });
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function createTask(text) {
    const li = document.createElement("li");

    const span = document.createElement("span");
    span.textContent = text;

    const delBtn = document.createElement("button");
    delBtn.textContent = "Delete";

    delBtn.addEventListener("click", () => {
      li.remove();
      saveTasks();
    });

    li.appendChild(span);
    li.appendChild(delBtn);
    taskList.appendChild(li);
  }

  addBtn.addEventListener("click", () => {
    const text = taskInput.value.trim();
    if (!text) return;

    createTask(text);
    saveTasks();
    taskInput.value = "";
  });

  loadBtn.addEventListener("click", () => {
    taskList.innerHTML = "";
    const saved = JSON.parse(localStorage.getItem("tasks")) || [];
    saved.forEach(task => createTask(task));
  });
</script>

<!-- ===== CSS (AT END) ===== -->
<style>
  :root {
    --bg: #f4fefe;
    --text: #0f2f3a;
    --nav: #0b4f6c;
    --card: #ffffff;
    --btn: #ff6f61;
  }

  body.dark {
    --bg: #0b1e24;
    --text: #e8f8fb;
    --nav: #041217;
    --card: #122b33;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
  }

  .nav {
    background: var(--nav);
    color: white;
    padding: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav a {
    color: white;
    text-decoration: none;
    margin: 0 0.4rem;
    padding: 0.4rem 0.8rem;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
  }

  button {
    background: var(--btn);
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
  }

  .card {
    max-width: 400px;
    margin: 2rem auto;
    padding: 2rem;
    background: var(--card);
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 6px 10px rgba(0,0,0,0.1);
  }

  input {
    width: 80%;
    padding: 0.5rem;
    margin: 0.5rem 0;
  }

  ul {
    list-style: none;
    padding: 0;
  }

  li {
    background: rgba(0,0,0,0.05);
    padding: 0.6rem;
    margin: 0.5rem 0;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .hidden {
    display: none;
  }
</style>

</body>
</html>
